<!DOCTYPE html>
<html lang="en">
<head>

<title>Storm Inventory — Scan a bin label</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; height: 100dvh; background: #111; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { display: flex; flex-direction: column; }
header { background: #000; color: #fff; padding: calc(10px + env(safe-area-inset-top)) 56px 10px; text-align: center; min-height: 56px; font-size: 18px; font-weight: 700; letter-spacing: .5px; flex: 0 0 auto; }
header span { color: #29ABE2; } header .hdr-logo { height: 30px; width: auto; max-width: 60vw; display: block; margin: 0 auto; }
#view { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }

#focus-ring { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s ease; }

#msg.err { color: #ff5a5a; }
#foot { flex: 0 0 auto; display: flex; gap: 12px; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
#foot button { flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; }
#cancel { background: #222; color: #fff; border: 1px solid #555; }
#done { background: #29ABE2; color: #fff; border: 1px solid #29ABE2; font-weight: 700; }
#pop { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; display: flex; align-items: center; gap: 12px; background: #16212E; color: #fff; border: 1px solid #29ABE2; border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); transform: translateY(130%); opacity: 0; transition: transform .28s ease, opacity .28s ease; pointer-events: none; }
#pop.show { transform: translateY(0); opacity: 1; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#pop.show:active { transform: translateY(2px) scale(.98); filter: brightness(.92); }
#pop img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: #222; flex: 0 0 auto; }
#pop-name { font-weight: 700; font-size: 16px; line-height: 1.25; }
#pop-sub { font-size: 14px; color: #9fd8f0; margin-top: 2px; }

#cam-close { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 12px; width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.5); background: rgba(15,23,32,.38); -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4); box-shadow: 0 2px 10px rgba(0,0,0,.2); color: #fff; font-size: 26px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cam-close.pressed, #cam-close:active { transform: translateY(2px) scale(.96); filter: brightness(.9); box-shadow: inset 0 3px 8px rgba(15,23,32,.3); transition: transform .06s ease, filter .06s ease, box-shadow .06s ease; }
header { position: relative; padding-right: 60px; }
#edge { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; overflow: visible; }
#safe-probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#edge path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 14px rgba(255,255,255,.6)); }
#trace { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
#trace polygon { fill: rgba(41,171,226,.12); stroke: #29ABE2; stroke-width: 4; stroke-linejoin: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; filter: drop-shadow(0 0 5px rgba(41,171,226,.9)); opacity: 0; transition: opacity .2s ease; }
#trace.on polygon { opacity: 1; animation: traceDraw .35s ease-out forwards; }
@keyframes traceDraw { to { stroke-dashoffset: 0; } }
#edge path { display: none; }
#glow { position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0; box-shadow: inset 0 0 22px 4px rgba(255,255,255,.55), inset 0 0 60px 10px rgba(255,255,255,.24); transition: opacity .3s ease; }
#edge.searching + #glow { animation: glowPulse 1.8s ease-in-out infinite; }
#edge.hit + #glow { animation: none; opacity: 1; box-shadow: inset 0 0 30px 8px rgba(255,255,255,.75), inset 0 0 80px 18px rgba(255,255,255,.36); }
#edge.fade + #glow { animation: none; opacity: 0; }
@keyframes glowPulse { 0%, 100% { opacity: .1; } 50% { opacity: .68; } }
#edge.searching path { animation: edgeLoad 2.4s linear infinite; }
#edge.hit path { animation: none; stroke-dashoffset: 0; transition: stroke-dashoffset .3s ease-out; stroke-width: 5; }
#edge.fade path { opacity: 0; transition: opacity .4s ease; }
@keyframes edgeLoad { 0% { stroke-dashoffset: 100; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
#pop { transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .45s ease; }
#pop.gone { transform: translateX(-115%) !important; opacity: 0 !important; }
#cart-pill { position: absolute; right: 14px; bottom: 14px; z-index: 12; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; border: 1px solid #29ABE2; background: rgba(15,23,32,.88); color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.4); transition: transform .3s ease, opacity .3s ease; }
#cart-pill.hide { opacity: 0; transform: translateY(20px); pointer-events: none; }
#cart-pill.bump { animation: bump .45s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#cart-pill .cnt { background: #29ABE2; border-radius: 999px; min-width: 24px; height: 24px; line-height: 24px; text-align: center; font-size: 13px; padding: 0 6px; }
#sheet { position: fixed; left: 10px; right: 10px; top: 70px; bottom: 90px; z-index: 40; display: none; flex-direction: column; background: rgba(15,23,32,.96); border: 1px solid #29ABE2; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
#sheet.open { display: flex; overflow: hidden; }
#sheet.closing { opacity: 0; }
#sheet.minimizing { opacity: 0; transform: scale(.08); }
#sheet.washout { animation: sheetWash .8s cubic-bezier(.5,0,.75,0) forwards; }
#sheet.fx-exit { animation: cartExit .46s cubic-bezier(.5,0,.75,0) forwards !important; transition: none !important; }
@keyframes cartExit { 0% { transform: translate(0,0) scale(1); opacity: 1; animation-timing-function: cubic-bezier(.3,0,.3,1); } 26% { transform: translate(-16px,-6px) scale(1.015); opacity: 1; animation-timing-function: cubic-bezier(.6,0,.9,.4); } 100% { transform: translate(115%,-2px) scale(.98); opacity: 0; } }
@keyframes sheetWash { 0% { transform: translateX(0); } 38% { transform: translateX(-6px); } 100% { transform: translateX(125%) rotate(3deg); opacity: .85; } }
#sheet-wash { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; pointer-events: none; z-index: 6; border-radius: 16px; transform: translateX(-110%); background: linear-gradient(90deg, rgba(41,171,226,.15), rgba(41,171,226,.6) 55%, rgba(41,171,226,.85)); }
#sheet-wash::after { content: ''; position: absolute; top: -40px; bottom: -40px; right: -38px; width: 40px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='80' viewBox='0 0 40 80'><path d='M0 0 H18 C34 10 34 30 18 40 C2 50 2 70 18 80 H0 Z' fill='rgb(41,171,226)' fill-opacity='.85'/></svg>") repeat-y; background-size: 40px 80px; animation: waveRoll .5s linear infinite; }
@keyframes waveRoll { from { background-position: 0 0; } to { background-position: 0 80px; } }
#sheet.washout #sheet-wash { animation: washIn .42s cubic-bezier(.3,.6,.4,1) forwards; }
@keyframes washIn { to { transform: translateX(0); } }
.drop { position: fixed; z-index: 45; width: 10px; height: 13px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 35% 35%, #bfe9fa, #29ABE2 60%, #1b7fae); pointer-events: none; animation: dropFly .75s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes dropFly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
#sheet-head { display: flex; align-items: center; padding: 12px 12px 8px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
#sheet-head h2 { margin: 0; font-size: 18px; flex: 1; }

#sheet-list { flex: 1; overflow-y: auto; padding: 6px 12px; }
.line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.line img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #222; flex: none; }
.line .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.25; }
.line .pr { font-size: 13px; color: #9fd8f0; margin-top: 2px; font-weight: 400; }
.qty { display: flex; align-items: center; border: 1px solid #29ABE2; border-radius: 10px; overflow: hidden; flex: none; }
.qty button { width: 36px; height: 36px; border: 0; background: transparent; color: #fff; font-size: 20px; padding: 0; }
.qty span { min-width: 28px; text-align: center; font-weight: 700; }
#sheet-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; }
.empty { padding: 30px 10px; text-align: center; color: #9ca3af; }
.hap { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
#glow, #edge { display: none !important; }
video { image-rendering: auto; }
/* v98 (Hark, 2026-11-08): landscape phones. The camera fills the left side; logo, X, status and Cancel/Done move into a side column on the right */
@media (orientation: landscape) and (max-height: 600px) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) calc(232px + env(safe-area-inset-right)); grid-template-rows: auto minmax(0, 1fr) auto; }
  #view { grid-column: 1; grid-row: 1 / span 3; height: 100%; }
  header { grid-column: 2; grid-row: 1; min-height: 0; padding: calc(10px + env(safe-area-inset-top)) calc(60px + env(safe-area-inset-right)) 10px 14px; text-align: left; }
  header .hdr-logo, header .storm-logo-lit { margin: 7px 0 0 0 !important; }
  #cam-close { right: calc(10px + env(safe-area-inset-right)); }
  #msg { grid-column: 2; grid-row: 2; align-self: center; padding: 8px calc(14px + env(safe-area-inset-right)) 8px 14px; font-size: 15px; min-height: 0; }
  #foot { grid-column: 2; grid-row: 3; flex-direction: column; gap: 10px; padding: 0 calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 14px; }
  #foot button { flex: none; width: 100%; padding: 11px; }
  #sheet { top: 10px; bottom: 10px; left: calc(10px + env(safe-area-inset-left)); right: calc(242px + env(safe-area-inset-right)); }
  #pop { left: calc(12px + env(safe-area-inset-left)); right: calc(244px + env(safe-area-inset-right)); }
}
/* v100 (Hark, 2026-11-09): QR outline traces in the same white neon line as the STORM logo / edge loader */
#trace polygon { fill: none !important; stroke: #fff !important; stroke-width: 3 !important; stroke-linecap: round; stroke-linejoin: round !important; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 14px rgba(255,255,255,.6)) !important; }
#trace.on polygon { animation: traceDraw .45s cubic-bezier(.4,0,.2,1) forwards !important; }

/* v130 (Hark, 2026-11-09): lens picker. One chip per back lens the phone shares with the browser, plus zoom steps when the lens supports zoom. Tap a chip to switch; the choice is remembered. */
#lens-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 11; display: none; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(15,23,32,.42); -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4); border: 1px solid rgba(255,255,255,.28); }
#lens-bar.on { display: flex; }
#lens-bar button { min-width: 42px; height: 34px; padding: 0 10px; border-radius: 999px; border: 0; background: transparent; color: #fff; font: 700 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
#lens-bar button.sel { background: #fff; color: #16212E; }
#lens-bar button:active { transform: scale(.94); }
#lens-bar { background: rgba(217,217,222,.92) !important; border: 1.5px solid rgba(255,255,255,.85) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; padding: 3px !important; }
#lens-bar .lens-chips { position: relative; display: flex; gap: 6px; z-index: 1; }
#lens-bar .lens-thumb { position: absolute; left: 0; top: 3px; height: 34px; width: 42px; border-radius: 999px; background: #000; box-shadow: 0 2px 6px rgba(0,0,0,.3); opacity: 0; transition: transform .32s cubic-bezier(.3,.7,.2,1), width .32s cubic-bezier(.3,.7,.2,1), opacity .2s ease; }
#lens-bar button, #lens-bar button.sel { background: transparent !important; color: #1c1c1e; transition: color .32s ease; position: relative; }
#lens-bar button.sel { color: #fff !important; }
@media (max-width: 420px) { #lens-bar { left: 12px; transform: none; } }

/* v130 (Hark, 2026-11-09): in-camera cart matches the main-screen cart (same font, sizes and stepper), on see-through frosted white instead of dark blue */
#sheet { background: rgba(255,255,255,.72) !important; -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); border: 1px solid rgba(255,255,255,.85) !important; color: #172135; box-shadow: 0 12px 40px rgba(0,0,0,.35) !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#sheet-head { padding: 14px 12px 8px 16px; border-bottom: 1px solid rgba(17,24,39,.12); }
#sheet-head h2 { font-size: 19px; font-weight: 700; color: #172135; }
#sheet-head button { border: 0; background: none; color: #16212E; font-size: 30px; width: 40px; }
#sheet-list { padding: 0 16px; }
.line { gap: 10px; padding: 12px 0; border-bottom: 0; border-top: 1px solid rgba(17,24,39,.12); }
.line:first-child { border-top: 0; }
.line .nm { font-size: 16px; font-weight: 700; line-height: 1.3; color: #172135; }
.line .pr { font-size: 13px; color: #6B7280; margin-top: 2px; }
.line img { background: #F3F4F6; }
.qty { border: 1px solid #D1D5DB; border-radius: 10px; background: #fff; }
.qty button { width: 44px; height: 44px; font-size: 24px; font-weight: 700; background: #F3F4F6; color: #16212E; }
.qty span { min-width: 44px; font-size: 18px; color: #172135; }
#sheet-foot { border-top: 1px solid rgba(17,24,39,.12); color: #172135; font-size: 19px; font-weight: 800; }
#sheet .empty { color: #6B7280; }
/* v131 (Hark, 2026-11-09): camera cart button is the same tile as the main screen cart: 44 px frosted square, cart icon, blue count badge, total chip under it */
#cart-pill { width: 44px; height: 44px; padding: 0 !important; gap: 0 !important; justify-content: center; border-radius: 12px !important; background: rgba(15,23,32,.38) !important; -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4); border: 1px solid rgba(255,255,255,.5) !important; box-shadow: 0 2px 10px rgba(0,0,0,.2) !important; color: #fff; overflow: visible; bottom: calc(40px + env(safe-area-inset-bottom)) !important; right: 14px !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#cart-pill svg { width: 24px; height: 24px; }
#cart-pill .cnt { position: absolute; top: -7px; right: -7px; min-width: 20px !important; height: 20px !important; padding: 0 5px !important; border-radius: 999px; background: #29ABE2; color: #fff; font-size: 12px !important; font-weight: 700; line-height: 20px !important; text-align: center; }
#cart-pill #cart-tot { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; color: #fff; background: rgba(15,23,32,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 1px 6px; border-radius: 6px; }
</style>

<body>
<header><img class="hdr-logo" src="https://drive.google.com/thumbnail?id=1APQ3gyenuDNOoCyvC-NhXg-2L8tM0REM&amp;sz=w400" alt="STORM"><button id="cam-close" type="button" aria-label="Close camera">&times;</button></header>
<div id="view"><video id="video" playsinline muted autoplay></video><div id="reader" style="display:none"></div><div id="focus-ring"></div><svg id="trace" aria-hidden="true" preserveAspectRatio="none"><polygon id="trace-poly" pathLength="100" points=""></polygon></svg><button id="cart-pill" type="button" aria-label="Open cart"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cnt" id="cart-cnt">0</span><span id="cart-tot">$0.00</span></button></div>
<div id="msg">Looking for a code…</div>
<div id="foot"><button id="cancel" type="button">Cancel</button><button id="done" type="button">Done</button></div>
<div id="pop"><img id="pop-img" alt=""><div><div id="pop-name"></div><div id="pop-sub">Added to cart</div></div></div>

<div id="sheet" role="dialog" aria-label="Cart"><div id="sheet-head"><h2>Cart</h2><button id="sheet-min" type="button" aria-label="Minimize">&minus;</button><button id="sheet-x" type="button" aria-label="Close">&times;</button></div><div id="sheet-list"></div><div id="sheet-foot"><span id="sheet-units">0 items</span><span id="sheet-total">$0.00</span></div></div>
<label class="hap" aria-hidden="true"><input type="checkbox" switch id="hap-input"></label>
<script>
(function () {
// v75: tap-to-focus, scanned popup, Done returns all scans (?scans=).
// v78: pulsing white side glow instead of the line, centered logo only, buttons clear of the home bar.
// v77: true-viewport white edge glow, STORM logo, blue QR tracing (jsQR fallback for iPhone).
// v76 adds the edge loader, beep + haptic and the in-camera cart (see below).
// The app passes ?return=<app exec URL>. Defaults to the live app.
var params = new URLSearchParams(location.search);
var returnUrl = params.get('return') || 'https://script.google.com/macros/s/AKfycbz1Cx5_SxpOPCaNSgHs3DK6wDCqktmepnQ1JMUzmr_kLTJ0B2oPHkZZGBrhjku0FxPINw/exec'; try { if (localStorage.getItem('stormWrap') === '1' && /script\.google\.com\/macros\/s\/[^/]+\/exec/.test(returnUrl)) returnUrl = 'https://storm-basement-waterproofing.github.io/storm-inventory-scanner/' + (returnUrl.indexOf('?') >= 0 ? returnUrl.slice(returnUrl.indexOf('?')) : ''); } catch (e) {}
var msg = document.getElementById('msg');
var video = document.getElementById('video');
var view = document.getElementById('view');
var ring = document.getElementById('focus-ring');
var pop = document.getElementById('pop');
var popImg = document.getElementById('pop-img');
var popName = document.getElementById('pop-name');
var popSub = document.getElementById('pop-sub');
var doneBtn = document.getElementById('done');
var stream = null;
window.__stormSwapStream = function (s2) { stream = s2; };
var done = false;
var stillTimer = null;
var popTimer = null;
var scans = [];
var lastText = '';
var lastAt = 0;

// v76: edge loader, beep + haptic, in-camera cart with qty editing.
// The app passes ?cart=<bin*qty,...>&px=<bin~price,...>. When px is present
// this page returns the whole edited cart as ?cart=...&ct=<stamp>; with an
// older app (no px) it falls back to ?scans=.
var hasCartApi = params.has('px');
var PX = {};
(params.get('px') || '').split(',').forEach(function (s) { var a = s.split('~'); if (a[0]) PX[a[0]] = Number(a[1]); });
var cart = [];
(params.get('cart') || '').split(',').forEach(function (s) { var a = s.split('*'); var q = Math.floor(Number(a[1])); if (a[0] && q > 0) cart.push({ bin: a[0], qty: q }); });
var ITEM_BY_ID = null;
function itemById(id) {
  if (!ITEM_BY_ID) { ITEM_BY_ID = {}; ITEMS.forEach(function (it) { ITEM_BY_ID[it.i] = it; ITEM_BY_ID[String(it.i).toLowerCase()] = it; }); }
  return ITEM_BY_ID[id] || ITEM_BY_ID[String(id).toLowerCase()] || null;
}
function money(n) { return '$' + Number(n || 0).toFixed(2); }
function cartTotals() { var u = 0, t = 0; cart.forEach(function (c) { u += c.qty; if (PX[c.bin] != null) t += PX[c.bin] * c.qty; }); return { units: u, total: t }; }
function cartAdd(bin) { for (var i = 0; i < cart.length; i++) if (cart[i].bin === bin) { cart[i].qty++; return cart[i].qty; } cart.push({ bin: bin, qty: 1 }); return 1; }
var pill = document.getElementById('cart-pill');
function renderPill(bump) {
  var t = cartTotals();
  document.getElementById('cart-cnt').textContent = t.units;
  document.getElementById('cart-tot').textContent = money(t.total);
  if (bump) { pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump'); }
}
// Edge loader: thin blue line from the top middle, around the screen edge, back to the top middle.
var edge = document.getElementById('edge');
var edgePath = document.getElementById('edge-path');
function layoutEdge() {
  var vv = window.visualViewport;
