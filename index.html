<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="STORM Inventory">
<title>STORM Inventory</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180.png?v=2">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; opacity: 0; transition: opacity .35s ease; }
  #app { visibility: hidden; } #app.ready { opacity: 1; visibility: visible; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; transition: opacity .4s ease; }
  /* v85 (Hark, 2026-11-08): the logo is centred by the flex box (no translate tricks), its size is reserved before the picture loads,
     and it starts invisible: once the picture is decoded it fades in, then the pulse starts. No jump on iPad or Android. */
  #boot img { position: relative; display: block; width: min(62vw, 300px); height: auto; aspect-ratio: 1412 / 364; opacity: 0; transform-origin: 50% 50%; }
  #boot img.in { animation: bootIn .7s cubic-bezier(.25,.1,.25,1) forwards, pulse 1.4s ease-in-out .7s infinite; }
  @keyframes bootIn { from { opacity: 0; } to { opacity: 1; } }
  #boot { z-index: 2; }
  #cover { position: absolute; inset: 0; background: #000; will-change: opacity; }
  #boot.fly { pointer-events: none; background: transparent; }
  #app { transition: opacity .5s ease; }
  #boot.gone { opacity: 0; pointer-events: none; transition: opacity .22s cubic-bezier(.4,0,.2,1); }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.95); } }
  /* v86 (Hark, 2026-11-08): no logo on the loading screen. A neon line (same look as the header logo trace) starts at the top middle,
     runs clockwise around the edge of the screen while the app loads, and closes at the top just as the page is ready;
     that is the moment the header STORM trace starts, so it reads as one loop. */
  #edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
    filter: drop-shadow(0 0 2px rgba(90,195,255,.95)) drop-shadow(0 0 7px rgba(60,170,255,.6)); transition: opacity .55s ease; }
  #edge path { fill: none; stroke: #effaff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  #boot.done #edge { opacity: 0; }
  #camwrap { position: fixed; inset: 0; z-index: 5; background: #000; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; opacity: 0; transition: opacity .18s ease; }
  #camwrap.on { opacity: 1; }
  #camwrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>
</head>
<body style="background:#000">
<div id="boot"><div id="cover"></div><svg id="edge" aria-hidden="true"><path id="edgep" pathLength="1"></path></svg></div>
<iframe id="app" title="STORM Inventory" allow="clipboard-read; clipboard-write; camera; microphone; autoplay; fullscreen; web-share"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbz1Cx5_SxpOPCaNSgHs3DK6wDCqktmepnQ1JMUzmr_kLTJ0B2oPHkZZGBrhjku0FxPINw/exec';
  try { localStorage.setItem('stormWrap', '1'); } catch (e) {}
  var f = document.getElementById('app'), boot = document.getElementById('boot'), cover = document.getElementById('cover');
  var edge = document.getElementById('edge'), ep = document.getElementById('edgep');
  function edgePath() {
    var W = window.innerWidth, H = window.innerHeight, i = 3, R = Math.min(44, Math.round(Math.min(W, H) * .06));
    var L = i, T = i, Rt = W - i, B = H - i, M = W / 2;
    ep.setAttribute('d', 'M' + M + ' ' + T + ' H' + (Rt - R) + ' A' + R + ' ' + R + ' 0 0 1 ' + Rt + ' ' + (T + R) + ' V' + (B - R)
      + ' A' + R + ' ' + R + ' 0 0 1 ' + (Rt - R) + ' ' + B + ' H' + (L + R) + ' A' + R + ' ' + R + ' 0 0 1 ' + L + ' ' + (B - R)
      + ' V' + (T + R) + ' A' + R + ' ' + R + ' 0 0 1 ' + (L + R) + ' ' + T + ' Z');
    edge.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  }
  edgePath(); window.addEventListener('resize', edgePath);
  /* pace: one loop in about 2.2 s; if the app is not ready by ~88% the line creeps, then finishes at full pace once it is */
  var LOOP = 2200, HOLD = .88, p = 0, last = 0, ready = false, src = null, finished = false, settled = false;
  function markReady(s2) { if (ready) return; ready = true; if (s2) src = s2; f.classList.add('ready'); }
  function tick(now) {
    if (!last) last = now; var dt = Math.min(50, now - last); last = now;
    var v = 1 / LOOP;
    if (!ready && p >= HOLD) v *= .08;               /* still loading: creep so the loop never closes early */
    else if (ready && p >= HOLD) v *= 1.15;          /* ready: run home a touch quicker */
    p = Math.min(1, p + v * dt);
    ep.style.strokeDashoffset = (1 - p).toFixed(4);
    if (ready) cover.style.opacity = Math.max(0, Math.min(1, (1 - p) / .12)).toFixed(3); /* the page shows through over the last stretch */
    if (p >= 1) return finish();
    requestAnimationFrame(tick);
  }
  function finish() {
    if (finished) return; finished = true; settled = true;
    try { (src || f.contentWindow).postMessage({ storm: 'landed' }, '*'); } catch (e) {}  /* header STORM trace starts right as the loop closes */
    cover.style.opacity = '0'; boot.classList.add('done');
    setTimeout(function () { boot.classList.add('gone'); }, 600);
  }
  requestAnimationFrame(tick);
  function plainFade() { markReady(null); }
  window.addEventListener('message', function (e) { var m = e.data; if (m && m.storm === 'logo') markReady(e.source); });
  var loaded = false;
  f.addEventListener('load', function () { if (loaded) return; loaded = true; setTimeout(plainFade, 3000); });
  f.src = EXEC + location.search;
  setTimeout(plainFade, 9000);
  /* v82 (Hark, 2026-11-07): the camera opens as a layer on top of the app. Closing it (X, Cancel or Done) just removes the layer,
     so the app is still exactly where it was. Scans and cart changes are handed straight to the app. */
  var camApp = null;
  function openCam(q, src) {
    closeCam(true); camApp = src;
    var w = document.createElement('div'); w.id = 'camwrap';
    var fr = document.createElement('iframe'); fr.title = 'Scan a bin label';
    fr.setAttribute('allow', 'camera; microphone; autoplay; clipboard-read; clipboard-write');
    fr.src = 'scan.html' + q + (q.indexOf('?') >= 0 ? '&' : '?') + 'layer=1';
    w.appendChild(fr); document.body.appendChild(w);
    requestAnimationFrame(function () { w.classList.add('on'); });
    try { history.pushState({ stormCam: 1 }, ''); } catch (e) {}
  }
  function closeCam(silent, viaPop) {
    var w = document.getElementById('camwrap'); if (!w) return;
    w.classList.remove('on');
    setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 200); /* removing the frame turns the camera off */
    if (!viaPop && !silent) { try { if (history.state && history.state.stormCam) history.back(); } catch (e) {} }
  }
  window.addEventListener('popstate', function () { if (document.getElementById('camwrap')) closeCam(false, true); });
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m) return;
    if (m.storm === 'scan' && typeof m.q === 'string') { openCam(m.q, e.source); return; }
    if (m.storm === 'scanDone' && e.origin === location.origin) {
      try { if (camApp) camApp.postMessage({ storm: 'scanResult', cart: m.cart, ct: m.ct, scans: m.scans }, '*'); } catch (x) {}
      closeCam(false);
    }
  });
</script>
</body>
</html>
