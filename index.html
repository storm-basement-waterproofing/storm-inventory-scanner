<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="STORM Inventory">
<title>STORM Inventory</title>
<link rel="icon" href="assets/drop.png">
<link rel="apple-touch-icon" href="assets/drop.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; opacity: 0; transition: opacity .35s ease; }
  #app.ready { opacity: 1; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity .4s ease; }
  #boot img { position: absolute; left: 50%; top: 36.7%; width: min(62vw, 300px); height: auto; transform: translate(-50%, -50%); animation: pulse 1.4s ease-in-out infinite; }
  #boot { z-index: 2; }
  #boot.fly { pointer-events: none; background: transparent; transition: background .5s ease; }
  #app { transition: opacity .5s ease; }
  #boot.gone { opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  @keyframes pulse { 0%, 100% { opacity: .45; transform: translate(-50%, -50%) scale(.94); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
</style>
</head>
<body>
<div id="boot"><img src="assets/logo.png?v=1" alt="STORM Basement Waterproofing"></div>
<iframe id="app" title="STORM Inventory" allow="clipboard-read; clipboard-write; camera; microphone; autoplay; fullscreen; web-share"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbz1Cx5_SxpOPCaNSgHs3DK6wDCqktmepnQ1JMUzmr_kLTJ0B2oPHkZZGBrhjku0FxPINw/exec';
  try { localStorage.setItem('stormWrap', '1'); } catch (e) {}
  var f = document.getElementById('app'), boot = document.getElementById('boot'), img = boot.querySelector('img');
  var settled = false;
  function plainFade() { if (settled) return; settled = true; f.classList.add('ready'); setTimeout(function () { boot.classList.add('gone'); }, 250); }
  function handoff(m) {
    if (settled) return; settled = true;
    var r0 = img.getBoundingClientRect(), op = parseFloat(getComputedStyle(img).opacity) || 1;
    img.style.animation = 'none'; img.style.transition = 'none';
    img.style.left = r0.left + 'px'; img.style.top = r0.top + 'px'; img.style.width = r0.width + 'px';
    img.style.transform = 'none'; img.style.transformOrigin = '0 0'; img.style.opacity = op;
    void img.offsetWidth;
    var T = m.fly || 1150, k = m.w / r0.width;
    var dx = m.x - r0.left, dy = m.y - r0.top;
    var cx = r0.width * 0.04, cy = r0.height * 0.04; /* keep the push centred */
    var frames = [
      { transform: 'translate(0px,0px) scale(1)', opacity: op, offset: 0, easing: 'cubic-bezier(.4,0,.6,1)' },
      { transform: 'translate(' + cx + 'px,' + cy + 'px) scale(.92)', opacity: Math.min(op, .82), offset: .2, easing: 'cubic-bezier(.65,0,.3,1)' },
      { transform: 'translate(' + (dx * .78) + 'px,' + (dy * .78) + 'px) scale(' + (1 + (k - 1) * .78) + ')', opacity: .7, offset: .78, easing: 'cubic-bezier(.3,0,.2,1)' },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')', opacity: 0, offset: 1 }
    ];
    try { img.animate(frames, { duration: T, fill: 'forwards' }); }
    catch (e) { img.style.transition = 'left .8s ease, top .8s ease, width .8s ease, opacity .8s ease'; img.style.left = m.x + 'px'; img.style.top = m.y + 'px'; img.style.width = m.w + 'px'; img.style.opacity = '0'; }
    boot.classList.add('fly');
    f.classList.add('ready');
    setTimeout(function () { boot.classList.add('gone'); }, T + 60);
  }
  window.addEventListener('message', function (e) { var m = e.data; if (m && m.storm === 'logo' && typeof m.x === 'number') handoff(m); });
  var loaded = false;
  f.addEventListener('load', function () { if (loaded) return; loaded = true; setTimeout(plainFade, 4500); });
  f.src = EXEC + location.search;
  setTimeout(plainFade, 9000);
</script>
</body>
</html>
