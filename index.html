<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="STORM Inventory">
<title>STORM Inventory</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180.png?v=2">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; opacity: 0; transition: opacity .35s ease; }
  #app { visibility: hidden; } #app.ready { opacity: 1; visibility: visible; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; transition: opacity .4s ease; }
  #boot img { position: absolute; left: 50%; top: 36.7%; width: min(62vw, 300px); height: auto; transform: translate(-50%, -50%); animation: pulse 1.4s ease-in-out infinite; }
  #boot { z-index: 2; }
  #cover { position: absolute; inset: 0; background: #000; will-change: opacity; }
  #boot.fly { pointer-events: none; background: transparent; }
  #app { transition: opacity .5s ease; }
  #boot.gone { opacity: 0; pointer-events: none; transition: opacity .22s cubic-bezier(.4,0,.2,1); }
  @keyframes pulse { 0%, 100% { opacity: .45; transform: translate(-50%, -50%) scale(.94); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  #camwrap { position: fixed; inset: 0; z-index: 5; background: #000; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; opacity: 0; transition: opacity .18s ease; }
  #camwrap.on { opacity: 1; }
  #camwrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>
</head>
<body style="background:#000">
<div id="boot"><div id="cover"></div><img src="assets/logo.png?v=1" alt="STORM Basement Waterproofing"></div>
<iframe id="app" title="STORM Inventory" allow="clipboard-read; clipboard-write; camera; microphone; autoplay; fullscreen; web-share"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbz1Cx5_SxpOPCaNSgHs3DK6wDCqktmepnQ1JMUzmr_kLTJ0B2oPHkZZGBrhjku0FxPINw/exec';
  try { localStorage.setItem('stormWrap', '1'); } catch (e) {}
  var f = document.getElementById('app'), boot = document.getElementById('boot'), img = boot.querySelector('img');
  var settled = false, cover = document.getElementById('cover');
  function plainFade() { if (settled) return; settled = true; f.classList.add('ready'); setTimeout(function () { boot.classList.add('gone'); }, 250); }
  /* v76 (Hark, 2026-11-07): one GPU-only flight (transform + opacity), so it runs at the screen's full refresh (120 Hz on the Pixel).
     Push back, glide up while fading a little more, then punch in on the header. The app's header animation starts the moment it lands. */
  function handoff(m, src) {
    if (settled) return; settled = true;
    var r0 = img.getBoundingClientRect(), op = parseFloat(getComputedStyle(img).opacity) || 1;
    img.style.animation = 'none'; img.style.transition = 'none';
    img.style.left = r0.left + 'px'; img.style.top = r0.top + 'px'; img.style.width = r0.width + 'px';
    img.style.transform = 'translate3d(0,0,0)'; img.style.transformOrigin = '0 0'; img.style.opacity = op;
    img.style.willChange = 'transform, opacity'; img.style.backfaceVisibility = 'hidden';
    void img.offsetWidth;
    var T = m.fly || 1100, k = m.w / r0.width, dx = m.x - r0.left, dy = m.y - r0.top;
    /* v81: push, glide (fading a little), land, then a quick press-in. The press is what starts the app's trace animation. */
    var w0 = r0.width, h0 = r0.height, cx1 = dx + m.w / 2, cy1 = dy + m.h / 2;
    function ss(x) { x = Math.max(0, Math.min(1, x)); return x * x * x * (x * (x * 6 - 15) + 10); } /* smootherstep */
    function bell(x) { if (x <= 0 || x >= 1) return 0; var v = Math.sin(Math.PI * x); return v * v; }
    T = 1380; var LAND = 1040, PRESS = 1150, UP = 1380; /* ms: arrives, bottom of the press, released */
    function press(ms) { /* 0..1 depth of the press-in */
      if (ms <= LAND - 70 || ms >= UP) return 0;
      if (ms < PRESS) { var u = (ms - (LAND - 70)) / (PRESS - (LAND - 70)); return u * u * (3 - 2 * u); }
      var v = (ms - PRESS) / (UP - PRESS); return 1 - (1 - Math.pow(1 - v, 3));
    }
    var move = [], fade = [], N = 86;
    for (var i = 0; i <= N; i++) {
      var t = i / N, ms = t * T, p = ss((ms - 40) / (LAND - 40));
      var sc = (1 + (k - 1) * p) * (1 - .06 * bell(ms / 380)) * (1 - .1 * press(ms));
      var cx = w0 / 2 + (cx1 - w0 / 2) * p, cy = h0 / 2 + (cy1 - h0 / 2) * p;
      move.push({ transform: 'translate3d(' + (cx - sc * w0 / 2).toFixed(2) + 'px,' + (cy - sc * h0 / 2).toFixed(2) + 'px,0) scale(' + sc.toFixed(4) + ')', offset: t });
      var g = ms / (LAND - 60), base = op + (1 - op) * ss(g);
      fade.push({ opacity: +(base - (base - .3) * bell(g) * .95).toFixed(3), offset: t });
    }
    var told = false;
    function tell() { if (told) return; told = true; try { if (src) src.postMessage({ storm: 'landed' }, '*'); } catch (e) {} }
    function landed() { tell(); boot.classList.add('gone'); }
    setTimeout(tell, PRESS - 40); /* the trace starts at the bottom of the press (40 ms head start for the hop into the app) */
    setTimeout(function () { boot.classList.add('gone'); }, PRESS + 30); /* the wrapper logo lets go as the press releases */
    f.classList.add('ready'); /* the app is already faded in under the black cover */
    try {
      var a1 = img.animate(move, { duration: T, fill: 'forwards', easing: 'linear' });
      img.animate(fade, { duration: T, fill: 'forwards', easing: 'linear' });
      cover.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T * .7, delay: T * .1, fill: 'forwards', easing: 'cubic-bezier(.4,0,.2,1)' });
      a1.onfinish = landed;
    } catch (e) { cover.style.opacity = '0'; setTimeout(landed, 50); }
    boot.classList.add('fly');
  }
  window.addEventListener('message', function (e) { var m = e.data; if (m && m.storm === 'logo' && typeof m.x === 'number') handoff(m, e.source); });
  var loaded = false;
  f.addEventListener('load', function () { if (loaded) return; loaded = true; setTimeout(plainFade, 4500); });
  f.src = EXEC + location.search;
  setTimeout(plainFade, 9000);
  /* v82 (Hark, 2026-11-07): the camera opens as a layer on top of the app. Closing it (X, Cancel or Done) just removes the layer,
     so the app is still exactly where it was. Scans and cart changes are handed straight to the app. */
  var camApp = null;
  function openCam(q, src) {
    closeCam(true); camApp = src;
    var w = document.createElement('div'); w.id = 'camwrap';
    var fr = document.createElement('iframe'); fr.title = 'Scan a bin label';
    fr.setAttribute('allow', 'camera; microphone; autoplay; clipboard-read; clipboard-write');
    fr.src = 'scan.html' + q + (q.indexOf('?') >= 0 ? '&' : '?') + 'layer=1';
    w.appendChild(fr); document.body.appendChild(w);
    requestAnimationFrame(function () { w.classList.add('on'); });
    try { history.pushState({ stormCam: 1 }, ''); } catch (e) {}
  }
  function closeCam(silent, viaPop) {
    var w = document.getElementById('camwrap'); if (!w) return;
    w.classList.remove('on');
    setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 200); /* removing the frame turns the camera off */
    if (!viaPop && !silent) { try { if (history.state && history.state.stormCam) history.back(); } catch (e) {} }
  }
  window.addEventListener('popstate', function () { if (document.getElementById('camwrap')) closeCam(false, true); });
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m) return;
    if (m.storm === 'scan' && typeof m.q === 'string') { openCam(m.q, e.source); return; }
    if (m.storm === 'scanDone' && e.origin === location.origin) {
      try { if (camApp) camApp.postMessage({ storm: 'scanResult', cart: m.cart, ct: m.ct, scans: m.scans }, '*'); } catch (x) {}
      closeCam(false);
    }
  });
</script>
</body>
</html>
