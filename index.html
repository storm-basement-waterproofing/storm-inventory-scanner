<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="STORM Inventory">
<title>STORM Inventory</title>
<link rel="icon" href="assets/drop.png">
<link rel="apple-touch-icon" href="assets/drop.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; opacity: 0; transition: opacity .35s ease; }
  #app.ready { opacity: 1; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity .4s ease; }
  #boot img { width: min(72vw, 300px); height: auto; animation: pulse 1.4s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(80,190,255,.6)); }
  #boot.gone { opacity: 0; pointer-events: none; }
  @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div id="boot"><img src="https://drive.google.com/thumbnail?id=1APQ3gyenuDNOoCyvC-NhXg-2L8tM0REM&amp;sz=w800" alt="STORM Basement Waterproofing"></div>
<iframe id="app" title="STORM Inventory" allow="clipboard-read; clipboard-write; camera; microphone; autoplay; fullscreen; web-share"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbz1Cx5_SxpOPCaNSgHs3DK6wDCqktmepnQ1JMUzmr_kLTJ0B2oPHkZZGBrhjku0FxPINw/exec';
  try { localStorage.setItem('stormWrap', '1'); } catch (e) {}
  var f = document.getElementById('app');
  f.addEventListener('load', function () { f.classList.add('ready'); setTimeout(function () { document.getElementById('boot').classList.add('gone'); }, 250); });
  f.src = EXEC + location.search;
  setTimeout(function () { f.classList.add('ready'); document.getElementById('boot').classList.add('gone'); }, 8000);
</script>
</body>
</html>
