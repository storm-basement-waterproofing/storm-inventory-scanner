<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; opacity: 0; transition: opacity .35s ease; }
  #app { visibility: hidden; } #app.ready { opacity: 1; visibility: visible; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; transition: opacity .4s ease; }
  /* v85 (Hark, 2026-11-08): the logo is centred by the flex box (no translate tricks), its size is reserved before the picture loads,
     and it starts invisible: once the picture is decoded it fades in, then the pulse starts. No jump on iPad or Android. */
  #boot img { position: relative; display: block; width: min(62vw, 300px); height: auto; aspect-ratio: 1412 / 364; opacity: 0; transform-origin: 50% 50%; }
  #boot img.in { animation: bootIn .7s cubic-bezier(.25,.1,.25,1) forwards, pulse 1.4s ease-in-out .7s infinite; }
  @keyframes bootIn { from { opacity: 0; } to { opacity: 1; } }
  #boot { z-index: 2; }
  #cover { position: absolute; inset: 0; background: #000; will-change: opacity; }
  #boot.done #cover { transition: opacity .3s ease-out; }
  #boot.fly { pointer-events: none; background: transparent; }
  #app { transition: opacity .5s ease; }
  #boot.gone { opacity: 0; pointer-events: none; transition: opacity .22s cubic-bezier(.4,0,.2,1); }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.95); } }
  /* v86 (Hark, 2026-11-08): no logo on the loading screen. A neon line (same look as the header logo trace) starts at the top middle,
     runs clockwise around the edge of the screen while the app loads, and closes at the top just as the page is ready;
     that is the moment the header STORM trace starts, so it reads as one loop. */
  #edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
    transition: opacity .55s ease; }
  /* v91: the glow is drawn as soft strokes on the same dash as the core line (no CSS filter), so on iPad Safari the glow can never run ahead of the line */
  #edge path { fill: none; stroke: #effaff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0 99999; }
  #edge path.g1 { stroke: rgba(90,195,255,.55); stroke-width: 6; }
  #edge path.g2 { stroke: rgba(60,170,255,.18); stroke-width: 14; }
  /* v88 (Hark, 2026-11-08): the header logo traces on the loading screen at the same time as the edge line (both driven by one clock).
     When the loop closes, the edge and the logo flash together and the page is ready. */
  #boot.done { pointer-events: none; }
  #boot.done #edge { animation: edgeFlash 1.8s ease-out both; }
  @keyframes edgeFlash {
    0% { opacity: 1; filter: brightness(1) drop-shadow(0 0 2px rgba(90,195,255,.95)) drop-shadow(0 0 7px rgba(60,170,255,.6)); }
    18% { opacity: 1; filter: brightness(1.6) drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px rgba(200,235,255,.95)) drop-shadow(0 0 20px rgba(70,180,255,.75)); }
    100% { opacity: 0; filter: brightness(1) drop-shadow(0 0 2px rgba(90,195,255,.4)) drop-shadow(0 0 4px rgba(60,170,255,.15)); } }
  #ltrace { position: absolute; display: none; overflow: visible; pointer-events: none; filter: drop-shadow(0 0 1.5px rgba(90,195,255,.95)) drop-shadow(0 0 5px rgba(60,170,255,.55)); }
  #ltrace path { fill: none; stroke: #effaff; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 0 99999; }
  #boot.done #ltrace { animation: ltOut .35s ease .12s both; }
  @keyframes ltOut { to { opacity: 0; } }
  #camwrap { position: fixed; inset: 0; z-index: 5; background: #000; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; opacity: 0; transition: opacity .18s ease; }
  #camwrap.on { opacity: 1; }
  #camwrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  /* v105 (Hark, 2026-11-09): the Storm 3101 West Ridge Rd video (from 0:10) plays in the middle of the loading screen and fades out the moment the lines meet and the app opens */
  #bootvid { position: absolute; left: 50%; top: 50%; height: min(58vh, 103vw); aspect-ratio: 9 / 16; width: auto; transform: translate(-50%, -50%); object-fit: cover; border-radius: 18px; background: #000; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
  #bootvid.on { opacity: 1; }
  #boot.done #bootvid { opacity: 0 !important; transition: opacity .3s ease-out; }
</style>

  function placeLogo(r) { if (!lt || !r || !(r.w > 20)) return false; rect = r; lt.style.left = r.x + 'px'; lt.style.top = r.y + 'px'; lt.style.width = r.w + 'px'; lt.style.height = r.h + 'px'; lt.setAttribute('preserveAspectRatio', 'none'); lt.style.display = 'block';
    var sc = r.w / 800; for (var k = 0; k < lpaths.length; k++) { lpaths[k].style.strokeWidth = (1.7 / sc).toFixed(2); if (!LL[k]) { try { LL[k] = lpaths[k].getTotalLength(); } catch (e) { LL[k] = 900; } } } return true; }

  var KEY = 'stormLogoRect';
  try { var c = JSON.parse(localStorage.getItem(KEY) || 'null'); if (c && c.vw === window.innerWidth && c.vh === window.innerHeight && placeLogo(c)) q0 = 0; } catch (e) {}

  function ez(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
  function drawLogo(q) { for (var k = 0; k < lpaths.length; k++) { var u = Math.max(0, Math.min(1, (q * TT - (DELAYS[k] || 0)) / DUR)); /* v95: linear, so the drop is visibly drawing from the first frame, like the edge */ var L = LL[k] || 900; lpaths[k].style.strokeDasharray = (u * L).toFixed(1) + ' ' + (L + 10).toFixed(1); lpaths[k].style.opacity = u > 0 ? '1' : '0'; } /* v96: real lengths; iPad Safari ignores pathLength on dashes */ }

      try { localStorage.setItem(KEY, JSON.stringify({ x: m.x, y: m.y, w: m.w, h: m.h, vw: window.innerWidth, vh: window.innerHeight })); } catch (e) {}
      if (q0 < 0) { if (placeLogo(m)) q0 = p; } /* first launch: start the trace now and let the loop run long enough for it */
      else if (rect && (Math.abs(rect.x - m.x) > 2 || Math.abs(rect.y - m.y) > 2 || Math.abs(rect.w - m.w) > 2)) placeLogo(m);

  }

    try { (src || f.contentWindow).postMessage({ storm: 'landed', present: present }, '*'); } catch (e) {}  /* header STORM trace starts right as the loop closes */
    cover.style.opacity = '0'; boot.classList.add('done');
    var bv = document.getElementById('bootvid'); if (bv) setTimeout(function () { try { bv.pause(); } catch (e) {} bv.removeAttribute('src'); try { bv.load(); } catch (e) {} }, 400);

    function on() { if (!finished) bv.classList.add('on'); }
    bv.addEventListener('playing', on); try { var pr = bv.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} })();

  function plainFade() { markReady(null); }
  window.addEventListener('message', function (e) { var m = e.data; if (m && m.storm === 'logo') markReady(e.source, m); });
  var loaded = false;
  f.addEventListener('load', function () { if (loaded) return; loaded = true; setTimeout(plainFade, 3000); });
  f.src = EXEC + location.search;
  setTimeout(plainFade, 9000);
  /* v82 (Hark, 2026-11-07): the camera opens as a layer on top of the app. Closing it (X, Cancel or Done) just removes the layer,

  var camApp = null;
  function openCam(q, src) {

    var w = document.createElement('div'); w.id = 'camwrap';
    var fr = document.createElement('iframe'); fr.title = 'Scan a bin label';
    fr.setAttribute('allow', 'camera; microphone; autoplay; clipboard-read; clipboard-write');

  window.addEventListener('message', function (e) {

    if (m.storm === 'ping') { try { e.source.postMessage({ storm: 'pong' }, '*'); } catch (x) {} return; }
    if (m.storm === 'print' && m.pages && m.pages.length) {
      var base = location.origin + '/storm-inventory-scanner/checklists/';
      var pages = Array.prototype.filter.call(m.pages, function (u) { return typeof u === 'string' && u.indexOf(base) === 0; });
      if (!pages.length) return;

      pages.forEach(function (u) { var im = new Image(); im.onload = im.onerror = function () { if (--left === 0) go(); }; im.src = u; pr.appendChild(im); });

      try { if (camApp) camApp.postMessage({ storm: 'scanResult', cart: m.cart, ct: m.ct, scans: m.scans }, '*'); } catch (x) {}

    }
  });
