function patchCard(it) {
  if (!it) return;
  var el = cardEl(it.bin);

        var needHtml = '<div class="need-qty">Need: ' + it.need;

        needHtml += '</div>';

        tmp.innerHTML = needHtml;
        var priceEl = el.querySelector('.price');
        if (priceEl) priceEl.after(tmp.firstChild);
        else el.querySelector('.info').appendChild(tmp.firstChild);
      }
      var oldFlag = el.querySelector('.flag');
      if (oldFlag) oldFlag.remove();
      var flagHtml = flagFor(it);

        var t2 = document.createElement('div');

        var tr = el.querySelector('.top-right');
        if (tr) tr.insertBefore(t2.firstChild, tr.firstChild);

var saveQueues = {};
function saveCount(bin, value) {
  var q = saveQueues[bin];
  if (!q) { q = { busy: false, pending: null }; saveQueues[bin] = q; }
  q.pending = value;
  if (q.busy) return;
  pumpSaveQueue(bin);
}
function pumpSaveQueue(bin) {
  var q = saveQueues[bin];
  if (!q) return;
  var value = q.pending;
  q.pending = null;
  q.busy = true;
  google.script.run
    .withSuccessHandler(function(updated) {
      q.busy = false;
      if (q.pending !== null) { pumpSaveQueue(bin); return; }
      applyUpdate(updated);
      showToast('Saved');
    })
    .withFailureHandler(function() {
      q.busy = false;
      if (q.pending !== null) { pumpSaveQueue(bin); return; }
      showToast("Couldn't save — try again", true);
      load();
    })
    .updateCount(bin, value);
}

function savePar(bin, value) {

}

function orderListText(supplier) {
  var list = items.filter(function (it) { return it.need > 0 && (supplier === 'All' || it.supplier === supplier); });
  if (!list.length) return '';
  if (supplier === 'RichTech' || supplier === 'Hilti') {
    return list.map(function (it) {
      return (it.sku || it.bin) + (supplier === 'Hilti' ? '#' : ',') + it.need;

function orderAll(supplier) {

    ? 'Order list copied — tap Direct Text Entry, paste it in, then Upload'
    : 'Order list copied — paste it in Add Materials, then Generate';
  copyText(text, okMsg);
  if (!url) {
    showToast('Restock list not set up yet — list copied', true);
    return;
  }
  window.open(url, '_blank');
}

function copyText(text, okMsg) {
  function done(ok) { showToast(ok ? okMsg : 'Couldn\'t copy — long-press to select', !ok); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.setAttribute('readonly', '');
  document.body.appendChild(ta);  ta.focus();  ta.setSelectionRange(0, text.length);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  done(ok);
}

function copyOrderList(supplier) {

var PICK_KEY = 'stormPickListV15';
var pickList = []; 
function loadPickList() {
  pickList = [];
  try {
    var raw = localStorage.getItem(PICK_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    if (Array.isArray(arr)) {
      arr.forEach(function (p) {
        if (p && p.bin && p.qty > 0) pickList.push({ bin: String(p.bin), qty: Math.floor(p.qty) });
      });
    }
  } catch (e) { pickList = []; }
}
function savePickList() {
  try { localStorage.setItem(PICK_KEY, JSON.stringify(pickList)); } catch (e) {}
}
function pickQtyFor(bin) {
  for (var i = 0; i < pickList.length; i++) if (pickList[i].bin === bin) return pickList[i].qty;
  return 0;
}
function cardCountFor(bin) {
  
  
  
  var q = pickQtyFor(bin);
  if (q > 0) return q;
  var it = findItem(bin);
  return (it && it.onHand != null) ? it.onHand : '';
}
function syncCardCount(bin) {
  
  
  document.querySelectorAll('.card[data-bin="' + bin + '"] .count').forEach(function (input) { if (document.activeElement !== input) input.value = cardCountFor(bin); });
  syncDetailStepper(bin);  
}
function pickTotals() {
  var lines = pickList.length, units = 0;
  pickList.forEach(function (p) { units += p.qty; });
  return { lines: lines, units: units };
}
function addToPickList(bin) {
  var it = findItem(bin);
  if (!it || (it.supplier !== 'RichTech' && it.supplier !== 'Home Depot' && it.supplier !== 'Hilti' && it.supplier !== 'AutoZone')) return;
  var found = false;
  for (var i = 0; i < pickList.length; i++) {
    if (pickList[i].bin === bin) { pickList[i].qty++; found = true; break; }
  }
  if (!found) pickList.push({ bin: bin, qty: 1 });
  savePickList();
  updatePickButton(bin);
  syncCardCount(bin);  
  updatePickBar();
  renderPickSheet();
  var t = pickTotals();
  showToast('Added to order list (' + t.units + ' item' + (t.units === 1 ? '' : 's') + ')');
}
function setPickQty(bin, qty) { qty = Math.max(0, Math.floor(Number(qty) || 0));  
  for (var i = 0; i < pickList.length; i++) {
    if (pickList[i].bin === bin) {
      if (qty <= 0) pickList.splice(i, 1); 
      else pickList[i].qty = qty;
      break;
    }
  }
  savePickList();
  updatePickButton(bin);
  syncCardCount(bin);  
  updatePickBar();
  renderPickSheet();
}
function SyncCardQtyToPickList(bin, qty) {
  var it = findItem(bin);
  if (!it) return;
  qty = Math.max(0, Math.floor(Number(qty) || 0));
  if (it.supplier !== 'Home Depot' && it.supplier !== 'RichTech' && it.supplier !== 'Hilti' && it.supplier !== 'AutoZone') return;
  if (pickQtyFor(bin) > 0) { setPickQty(bin, qty); return; }
  if (qty > 0) { pickList.push({bin: bin, qty: qty}); savePickList(); updatePickButton(bin); syncCardCount(bin); updatePickBar(); renderPickSheet(); }
}
function ReconcilePickListToCards(){if(!items||!pickList)return;var changed=false;pickList.forEach(function(p){var it=findItem(p.bin);if(!it)return;if(p.qty<=0){ changed=true;pickList=pickList.filter(function(p){return p.qty>0;});if(changed){savePickList();renderPickSheet();updatePickBar();}}})}
function removeFromPickList(bin) {
  var it = findItem(bin);
  setPickQty(bin, 0);
  if (it) {
    it.onHand = 0;
    if (it.par != null) it.need = Math.max(0, it.par - it.onHand);
    patchCard(it);
    document.querySelectorAll('.card[data-bin="' + bin + '"] .count').forEach(function (input) { if (document.activeElement !== input) input.value = it.onHand; });
    updatePickBar();
    document.querySelectorAll('.card[data-bin="' + bin + '"] .need-qty').forEach(function (el) { if (it.need > 0) { el.textContent = 'Need ' + it.need; el.style.display = ''; } else { el.style.display = 'none'; } });
    updateTotals();
    saveCount(bin, 0);
  }
  setPickQty(bin, 0);
}






var currentDetailBin = null; function syncDetailStepper(bin) {
  if (currentDetailBin !== bin) return;
  var det = $('detail');
  if (!det || !det.classList.contains('open')) return;
  var it = findItem(bin);

function editPar(bin, btn) {
  var it = findItem(bin);
  if (!it) return;
  var input = document.createElement('input');
  input.type = 'number';
  input.inputMode = 'numeric';
  input.min = '0';
  input.className = 'par-input';
  input.value = it.par == null ? '' : it.par;
  input.placeholder = 'Par';
  btn.replaceWith(input);
  input.focus();
  input.select();
  var done = false;
  function save() {
    if (done) return;
    done = true;
    var v = input.value;
    
    it.par = (v === '' ? null : Math.max(0, Math.floor(Number(v) || 0)));
    it.need = (it.onHand == null || it.par == null) ? null : Math.max(0, it.par - it.onHand);
    renderPreservingScroll();
    savePar(bin, v);
  }
  input.addEventListener('change', save);
  input.addEventListener('blur', save);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
}

      if (group) {
        var wasOpen = group.classList.contains('open');
        document.querySelectorAll('.drawer-supplier.open').forEach(function (g) { g.classList.remove('open'); });
        if (!wasOpen) group.classList.add('open');
      }
      return;
    }
    var lab = e.target.closest('[data-drawer-labels]');
    if (lab) {
      var store = lab.getAttribute('data-drawer-labels');
      closeDrawer();
      if (LABEL_PDF_URLS[store]) window.open(LABEL_PDF_URLS[store], '_blank');
      return;
    }
  });

  
  
  
  var pendingBack = false; window.addEventListener('popstate', function () { if (pendingBack) { pendingBack = false; return; } if (history.state && history.state.overlay) { return; }
    if (overlayOpen === 'detail') {
      overlayOpen = null;
      currentDetailBin = null;
      $('detail').classList.remove('open');
      $('detail').innerHTML = '';
    } else if (overlayOpen === 'labels') {
      overlayOpen = null;
      $('labels').classList.remove('open');
      $('labels').innerHTML = '';
    } else if (overlayOpen === 'drawer') {
      overlayOpen = null;
      $('drawer').classList.remove('open');
      $('drawer-scrim').classList.remove('open');
    } else if (overlayOpen === 'pick') {
      
      overlayOpen = null;
      $('pick-sheet').classList.remove('open');
      $('pick-scrim').classList.remove('open');
    }
  });

  
  
  
  $('detail').addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  $('detail').addEventListener('touchend', function (e) {
    if (touchStartX == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    touchStartX = null;
    touchStartY = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var list = filtered().sort(byName); 
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].bin === currentDetailBin) idx = i;
    if (idx === -1) return;
    var next = dx < 0 ? list[idx + 1] : list[idx - 1];
    if (next) slideToDetail(next.bin, dx < 0 ? -1 : 1);
  }, { passive: true });

  
  
  $('list').addEventListener('click', function (e) {
    var photo = e.target.closest('.photo');
    if (photo) { openDetail(photo.getAttribute('data-details')); return; }
    var det = e.target.closest('.details-btn');
    if (det) { openDetail(det.getAttribute('data-details')); return; }
    var oa = e.target.closest('.order-all');
    if (oa) { orderAll(oa.getAttribute('data-orderall')); return; }
    var cl = e.target.closest('.copy-list');
    if (cl) { copyOrderList(cl.getAttribute('data-copylist')); return; }
    var pa = e.target.closest('[data-pick-add]');
    if (pa) { addToPickList(pa.getAttribute('data-pick-add')); return; }
    var os = e.target.closest('[data-order-single]');
    if (os) { orderSingle(os.getAttribute('data-order-single')); return; }
    var step = e.target.closest('.step');
    if (step) {
      var bin = step.getAttribute('data-bin');
      var it = findItem(bin);
      if (!it) return;
      
    
    if (pickQtyFor(bin) > 0) { setPickQty(bin, step.getAttribute('data-act') === 'plus' ? pickQtyFor(bin) + 1 : Math.max(0, pickQtyFor(bin) - 1)); return; }
     
    if (step.getAttribute('data-act') === 'plus') addToPickList(bin);  
     
       
       
       
       
      return;
    }
    var parBtn = e.target.closest('.par');
    if (parBtn) editPar(parBtn.getAttribute('data-bin'), parBtn);
  });

  $('list').addEventListener('change', function (e) {
    var input = e.target.closest('.count');
    if (!input) return;
    var bin = input.getAttribute('data-bin');
    var it = findItem(bin);
    if (!it) return;
    var v = input.value;
  
  
  if (pickQtyFor(bin) > 0) { setPickQty(bin, v === '' ? 0 : Math.max(0, Math.floor(Number(v) || 0))); input.value = cardCountFor(bin); return; }
  it.onHand = (v === '' ? null : Math.max(0, Math.floor(Number(v) || 0)));
    it.need = (it.onHand == null || it.par == null) ? null : Math.max(0, it.par - it.onHand);
    patchCard(it);
    saveCount(bin, v);
    SyncCardQtyToPickList(bin, v);
  });

  load();
});
</script>
</body>
</html>
